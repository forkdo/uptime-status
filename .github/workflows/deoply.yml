name: Deploy

on:
  push:
    branches:
      - main
      - dev
    paths:
      - .github/workflows/deoply.yml
      - package.json
      - public/**
      - src/**

  workflow_dispatch:
    inputs:
      environment:
        description: "Choose an environment to deploy to: <dev|staging|prod|main>"
        required: true
        default: "dev"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set config.js
        run: |
          node -e "
            const fs = require('fs');
            let config = fs.readFileSync('public/config.js', 'utf8');
            const vars = {
              SITE_NAME: '${{ vars.SITE_NAME }}',
              API_KEYS: '${{ vars.API_KEYS }}',
              SHOW_LINK: '${{ vars.SHOW_LINK }}',
              API_BASE_URL: '${{ vars.API_BASE_URL }}',
              API_TIMEOUT: '${{ vars.API_TIMEOUT }}',
              COUNT_DAYS: '${{ vars.COUNT_DAYS }}',
              NAV_ITEMS: '${{ vars.NAV_ITEMS }}'
            };
            if (vars.SITE_NAME) {
              config = config.replace(/SiteName: .*/, \"SiteName: '\" + vars.SITE_NAME + \"',\");
            }
            if (vars.API_KEYS) {
              const keys = vars.API_KEYS.split(',').map(k => \"    '\" + k.trim() + \"'\").join(',\\n');
              config = config.replace(/ApiKeys: \[[\s\S]*?\]/, 'ApiKeys: [\\n' + keys + '\\n  ]');
            }
            if (vars.SHOW_LINK) {
              config = config.replace(/ShowLink: .*/, 'ShowLink: ' + vars.SHOW_LINK + ',');
            }
            if (vars.API_BASE_URL) {
              config = config.replace(/ApiBaseUrl: .*/, \"ApiBaseUrl: '\" + vars.API_BASE_URL + \"',\");
            }
            if (vars.API_TIMEOUT) {
              config = config.replace(/ApiTimeout: .*/, 'ApiTimeout: ' + vars.API_TIMEOUT + ',');
            }
            if (vars.COUNT_DAYS) {
              config = config.replace(/CountDays: .*/, 'CountDays: ' + vars.COUNT_DAYS + ',');
            }
            if (vars.NAV_ITEMS) {
              const navItems = JSON.parse(vars.NAV_ITEMS);
              const naviArray = navItems.map(item => '    { text: \\'' + item.text + '\\', url: \\'' + item.url + '\\'}').join(',\\n');
              config = config.replace(/Navi: \[[\s\S]*?\]/, 'Navi: [\\n' + naviArray + '\\n  ]');
            }
            fs.writeFileSync('public/config.js', config);
          "
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  cloudflare:
    runs-on: ubuntu-latest
    needs: build
    env:
      BRANCH: ${{ inputs.BRANCH != '' && inputs.BRANCH || vars.BRANCH }}
    steps:      
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages   
          path: build    
      - name: Extract artifact
        run: |
          mkdir -p dist
          tar -xvf build/*.tar -C dist
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            pages deploy dist --project-name=${{ vars.PROJECT_NAME || 'status' }} --branch=${{ vars.BRANCH || 'main' }}

  # Deployment job
  deploy:
    environment:
      name: pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
